<header class="navbar-wrapper">
  <div class="navbar-container">
    <!-- Logotipo principal con el nuevo bicho geométrico -->
    <a routerLink="/publicaciones" class="brand-link">
      <div class="brand-logo-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="brand-bug-icon">
          <!-- Geometría del bicho -->
          <ellipse cx="12" cy="12" rx="4.5" ry="6"/>
          <line x1="12" y1="8" x2="12" y2="16"/>
          <circle cx="12" cy="6" r="1.5"/>
          <line x1="10.5" y1="5.5" x2="8.5" y2="3.5"/>
          <line x1="13.5" y1="5.5" x2="15.5" y2="3.5"/>
          <line x1="7.5" y1="9" x2="5.5" y2="7.5"/>
          <line x1="7" y1="12" x2="5" y2="12"/>
          <line x1="7.5" y1="15" x2="5.5" y2="16.5"/>
          <line x1="16.5" y1="15" x2="18.5" y2="16.5"/>
          <line x1="17" y1="12" x2="19" y2="12"/>
          <line x1="16.5" y1="9" x2="18.5" y2="7.5"/>
        </svg>
      </div>
      <span class="brand-text">UTN-BUGS</span>
    </a>

    <!-- Enlaces de navegación Desktop -->
    <nav class="nav-desktop">
      <a routerLink="/publicaciones" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="nav-icon">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
        <span>Publicaciones</span>
      </a>

      <a routerLink="/mi-perfil" routerLinkActive="active" class="nav-item">
        <img [src]="usuario()?.imagen || 'assets/logo.png'" alt="Avatar" class="avatar-sm" />
        <span>Mi Perfil</span>
      </a>

      <button type="button" class="btn-logout-nav" (click)="cerrarSesion()" title="Cerrar Sesión">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="logout-icon">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Cerrar Sesión</span>
      </button>
    </nav>

    <!-- Botón de apertura de drawer en mobile -->
    <button type="button" class="btn-burger" (click)="toggleMenu()" aria-label="Abrir menú de navegación">
      <span class="burger-bar"></span>
      <span class="burger-bar"></span>
      <span class="burger-bar"></span>
    </button>
  </div>
</header>

<!-- Drawer Lateral Responsive para Mobile -->
@if (menuAbierto()) {
  <div class="drawer-backdrop" (click)="cerrarMenu()">
    <aside class="drawer-panel" (click)="$event.stopPropagation()">
      <div class="drawer-top">
        <div class="brand-link">
          <div class="brand-logo-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="brand-bug-icon">
              <!-- Geometría del bicho -->
              <ellipse cx="12" cy="12" rx="4.5" ry="6"/>
              <line x1="12" y1="8" x2="12" y2="16"/>
              <circle cx="12" cy="6" r="1.5"/>
              <line x1="10.5" y1="5.5" x2="8.5" y2="3.5"/>
              <line x1="13.5" y1="5.5" x2="15.5" y2="3.5"/>
              <line x1="7.5" y1="9" x2="5.5" y2="7.5"/>
              <line x1="7" y1="12" x2="5" y2="12"/>
              <line x1="7.5" y1="15" x2="5.5" y2="16.5"/>
              <line x1="16.5" y1="15" x2="18.5" y2="16.5"/>
              <line x1="17" y1="12" x2="19" y2="12"/>
              <line x1="16.5" y1="9" x2="18.5" y2="7.5"/>
            </svg>
          </div>
          <span class="brand-text">UTN-BUGS</span>
        </div>
        <button type="button" class="btn-close-drawer" (click)="cerrarMenu()" aria-label="Cerrar menú">
          ✕
        </button>
      </div>

      <div class="drawer-profile">
        <img [src]="usuario()?.imagen || 'assets/logo.png'" alt="Avatar" class="avatar-drawer" />
        <div class="profile-meta">
          <h3 class="profile-name">{{ usuario()?.nombre }} {{ usuario()?.apellido }}</h3>
          <span class="profile-handle">&#64;{{ usuario()?.nombreUsuario }}</span>
        </div>
      </div>

      <nav class="drawer-links">
        <a routerLink="/publicaciones" (click)="cerrarMenu()" routerLinkActive="active" class="drawer-link-item">
          <div class="link-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="drawer-icon">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            </svg>
            <span>Publicaciones</span>
          </div>
          <span class="arrow-indicator">›</span>
        </a>

        <a routerLink="/mi-perfil" (click)="cerrarMenu()" routerLinkActive="active" class="drawer-link-item">
          <div class="link-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="drawer-icon">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Mi Perfil</span>
          </div>
          <span class="arrow-indicator">›</span>
        </a>
      </nav>

      <div class="drawer-bottom">
        <button type="button" class="btn-drawer-logout" (click)="cerrarSesion()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="drawer-logout-icon">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Cerrar Sesión</span>
        </button>

        <span class="drawer-sublegal-label">UTN-BUGS · Comunidad académica</span>
      </div>
    </aside>
  </div>
}
